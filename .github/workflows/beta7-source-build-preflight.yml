name: Beta 7 public source build evidence

on:
  push:
    branches: [codex/beta7-signpath-preflight-02-20261118]
    paths: [.github/workflows/beta7-source-build-preflight.yml]

permissions:
  contents: read

jobs:
  windows-source-build:
    if: github.repository == 'dex-ovo-studio/Navio'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: release-tag
            commit: 03e9a6338cc449547ad7f0bd14af908dc241e9f0
          - label: public-source-rev2
            commit: 9d595f6b42307f549ce0ffd86a8569bcf409f05a
    name: Windows compile (${{ matrix.label }})
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false

      - name: Verify checked out source
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ matrix.commit }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:SOURCE_COMMIT) {
            throw "Unexpected source commit: $commit"
          }
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          if ($package.version -cne '1.0.0-beta.7' -or $package.license -cne 'GPL-3.0-only') {
            throw 'Unexpected package version or license'
          }
          git log -1 --format='%H %T'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies without runtime download scripts
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Compile main, preload, and renderer
        run: node scripts/build-native.mjs

      - name: Write build evidence
        shell: pwsh
        env:
          SOURCE_LABEL: ${{ matrix.label }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify source tree' }
          $out = (Resolve-Path -LiteralPath 'out').Path
          foreach ($scope in @('main', 'preload', 'renderer')) {
            $folder = Join-Path $out $scope
            if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
              throw "Compilation did not produce out/$scope"
            }
            if (-not (Get-ChildItem -LiteralPath $folder -Recurse -File | Select-Object -First 1)) {
              throw "Compilation left out/$scope empty"
            }
          }
          $files = @(Get-ChildItem -LiteralPath $out -Recurse -File -Force | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($out, $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $evidence = [ordered]@{
            purpose = 'compile-only; no installation packages or signing input'
            repository = $env:GITHUB_REPOSITORY
            sourceLabel = $env:SOURCE_LABEL
            sourceCommit = $env:SOURCE_COMMIT
            sourceTree = $tree
            workflowCommit = $env:GITHUB_SHA
            workflowRef = $env:GITHUB_WORKFLOW_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
            runnerArchitecture = $env:RUNNER_ARCH
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            node = (node --version)
            pnpm = (pnpm --version)
            licenseSha256 = (Get-FileHash -LiteralPath 'LICENSE' -Algorithm SHA256).Hash.ToLowerInvariant()
            lockfileSha256 = (Get-FileHash -LiteralPath 'pnpm-lock.yaml' -Algorithm SHA256).Hash.ToLowerInvariant()
            compiledFileCount = $files.Count
            compiledFiles = $files
          }
          $path = Join-Path $env:RUNNER_TEMP 'beta7-build-evidence.json'
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $path -Encoding utf8
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "Compile-only source $env:SOURCE_COMMIT; output manifest SHA-256 $sha" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload compile evidence text file
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navio-beta7-${{ matrix.label }}-compile-evidence-no-binaries
          path: ${{ runner.temp }}/beta7-build-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Record artifact identifier
        shell: pwsh
        env:
          EVIDENCE_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          "Evidence artifact $env:EVIDENCE_ID; digest $env:EVIDENCE_DIGEST" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
