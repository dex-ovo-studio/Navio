    <text x="140" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" fill="#F1F7FF">Navio</text>
    <text x="32" y="217" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="600" fill="#F1F7FF">让连接与日常管理更清晰。</text>
    <text x="32" y="257" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#B8CDD9">Windows · Open source</text>
