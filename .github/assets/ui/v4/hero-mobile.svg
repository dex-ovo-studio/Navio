<svg xmlns="http://www.w3.org/2000/svg" width="480" height="328" viewBox="0 0 480 328" role="img" aria-labelledby="title description">
  <title id="title">Navio — Windows network and proxy management</title>
  <desc id="description">Navio brand artwork in the existing navy and mint palette. This is not an application screenshot or a release announcement.</desc>
  <!-- Logo paths and palette adapted from the project's V2 hero. See ASSET-SOURCES.md. -->
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#102A3B"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#70D7C1" stop-opacity=".18"/><stop offset="1" stop-color="#70D7C1" stop-opacity="0"/></radialGradient>
    <linearGradient id="icon" x2="1" y2="1"><stop stop-color="#22354B"/><stop offset="1" stop-color="#101B2D"/></linearGradient>
    <clipPath id="rounded"><rect width="480" height="328" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="480" height="328" fill="url(#surface)"/>
    <ellipse cx="450" cy="42" rx="240" ry="230" fill="url(#glow)"/>
    <path d="M288 328a192 192 0 0 1 192-192M344 328a136 136 0 0 1 136-136M400 328a80 80 0 0 1 80-80" fill="none" stroke="#70D7C1" stroke-opacity=".12"/>
